services:
  lab02_web:
    build:
      context: ./app
    container_name: lab02_web
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - lab02_net

networks:
  lab02_net:
    name: lab02_net
