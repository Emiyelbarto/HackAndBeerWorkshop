services:
  lab01_web:
    container_name: lab01_web
    build:
      context: ./app
    image: lab01_newspaper:1.0
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request, sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2).status == 200 else 1)
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    networks:
      - lab01_net

networks:
  lab01_net:
    name: lab01_net
